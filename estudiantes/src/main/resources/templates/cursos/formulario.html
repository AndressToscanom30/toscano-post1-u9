<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Curso</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2>Crear Curso</h2>

<form th:action="@{/cursos/guardar}" th:object="${curso}" method="post">
    <div class="mb-3">
        <label class="form-label">Nombre del curso</label>
        <input type="text" class="form-control" th:field="*{nombre}">
        <div class="text-danger" th:if="${#fields.hasErrors('nombre')}"
             th:errors="*{nombre}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">Créditos</label>
        <input type="number" class="form-control" th:field="*{creditos}" min="1" max="10">
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="/cursos" class="btn btn-secondary ms-2">Cancelar</a>
</form>

</body>
</html>
