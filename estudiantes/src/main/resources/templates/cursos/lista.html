<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Cursos</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2>Cursos</h2>
<a href="/cursos/nuevo" class="btn btn-primary mb-3">+ Nuevo Curso</a>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Créditos</th>
            <th>Estudiantes inscritos</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="curso : ${cursos}">
            <td th:text="${curso.id}"></td>
            <td th:text="${curso.nombre}"></td>
            <td th:text="${curso.creditos}"></td>
            <td>
                <!-- Muestra cantidad y nombres de estudiantes inscritos -->
                <span th:text="${#sets.size(curso.estudiantes)}"></span>
                inscritos:
                <ul class="mb-0">
                    <li th:each="est : ${curso.estudiantes}">
                        <span th:text="${est.nombre}"></span>
                        <!-- Botón para desinscribir -->
                        <form th:action="@{'/cursos/' + ${curso.id} + '/desinscribir/' + ${est.id}}"
                              method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger ms-1">X</button>
                        </form>
                    </li>
                </ul>
            </td>
            <td>
                <a th:href="@{'/cursos/' + ${curso.id} + '/inscribir'}"
                   class="btn btn-sm btn-success">Inscribir estudiante</a>
            </td>
        </tr>
    </tbody>
</table>

<a href="/" class="btn btn-secondary">Volver al inicio</a>
</body>
</html>
